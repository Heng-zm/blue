name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mgs-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mgs-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: mgs-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [analyze-test, android, windows, ios]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | cut -d+ -f1)"
          if [ -z "$version" ]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release assets
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist ios/Runner.app raw ipa/Payload

          cp artifacts/mgs-android-apk/app-release.apk "dist/mgs-$version-android.apk"

          (
            cd artifacts/mgs-windows
            zip -qry "../../dist/mgs-$version-windows-x64.zip" .
          )

          cp -R artifacts/mgs-ios-unsigned/. ios/Runner.app/

          # Artifact downloads do not keep Unix modes, so restore the
          # executable bit on every Mach-O binary before zipping.
          find ios/Runner.app -type f -print0 | while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              chmod +x "$file"
            fi
          done

          cp -R ios/Runner.app raw/Runner.app
          (
            cd raw
            zip -qry "../dist/mgs-$version-ios-unsigned.zip" Runner.app
          )

          cp -R ios/Runner.app ipa/Payload/Runner.app
          (
            cd ipa
            zip -qry "../dist/mgs-$version-ios-unsigned.ipa" Payload
          )

          unzip -l "dist/mgs-$version-ios-unsigned.ipa" | grep -q "Payload/Runner.app/Info.plist"

          (
            cd dist
            sha256sum mgs-* > SHA256SUMS.txt
          )
          ls -lh dist

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          notes="docs/release-notes/$tag.md"
          if [ -f "$notes" ]; then
            {
              cat "$notes"
              echo
              echo "## Verify"
              echo
              echo "SHA-256 checksums (\`SHA256SUMS.txt\` is attached to this release):"
              echo
              echo '```text'
              cat dist/SHA256SUMS.txt
              echo '```'
            } > release-body.md
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "MGS $tag" \
              --notes-file release-body.md
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "MGS $tag" \
              --generate-notes
          fi

